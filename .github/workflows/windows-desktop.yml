name: Windows desktop code build

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [hardening/reliability-v1, safety/browser-output-collision-20261018]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build guarded desktop code package
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\build_windows.ps1
      - name: Build and verify unsigned Store MSIX draft
        shell: powershell
        run: |
          $candidate = Get-ChildItem -Path dist-validation -Directory | Where-Object {
            (Test-Path -LiteralPath (Join-Path $_.FullName 'BrowserAutomationRunner.exe')) -and
            (Test-Path -LiteralPath (Join-Path $_.FullName 'pw-browsers'))
          } | Select-Object -First 1
          if (-not $candidate) { throw 'BrowserAutomationRunner complete payload not found' }
          ./store/build_msix_draft.ps1 `
            -PayloadDirectory $candidate.FullName `
            -OutputDirectory ("store-out-" + $env:GITHUB_RUN_ID)
      - name: Upload complete development payload
        uses: actions/upload-artifact@v4
        with:
          name: BrowserAutomationRunner-Windows-with-Chromium
          path: dist-validation/**
          if-no-files-found: error
      - name: Upload unsigned non-release Store MSIX draft
        uses: actions/upload-artifact@v4
        with:
          name: BrowserAutomationRunner-Store-MSIX-UNSIGNED-DRAFT
          path: |
            store-out-*/*.msix
            store-out-*/msix_validation.json
            store-out-*/msix.sha256.txt
          if-no-files-found: error

# These artifacts are unsigned technical drafts, not sales releases.

